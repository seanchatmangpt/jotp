[project]
name = "jotp-capability-estate"
version = "2026.8.2"
description = "RDF-owned JOTP capability admission and legacy-equivalence projection"
authors = ["Sean Chatman"]
license = "Apache-2.0"
repository = "https://github.com/seanchatmangpt/jotp"

[ontology]
source = "ontology/jotp-capabilities.ttl"
base_iri = "https://jotp.dev/ontology/capability#"

[ontology.prefixes]
cap = "https://jotp.dev/ontology/capability#"
dcterms = "http://purl.org/dc/terms/"
xsd = "http://www.w3.org/2001/XMLSchema#"

[inference]

[generation]
output_dir = "."

[[generation.rules]]
name = "jotp-capability-runtime"
query = { file = "ontology/queries/capabilities.rq" }
template = { file = "templates/JotpCapabilities.java.tera" }
output_file = "src/main/java/io/github/seanchatmangpt/jotp/JotpCapabilities.java"
skip_empty = false
mode = "Overwrite"
